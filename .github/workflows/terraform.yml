name: "🔧 Terraform — Infrastructure Provisioning"

on:
  push:
    branches: [ main ]
    paths:
      - 'terraform/**'     # Only run when terraform files change
  pull_request:
    branches: [ main ]
    paths:
      - 'terraform/**'
  workflow_dispatch:        # Manual trigger from GitHub Actions UI

env:
  TF_VERSION: "1.9.0"
  WORKING_DIR: "./terraform"
  GCP_PROJECT: "project-616fef18-15b8-4d6c-8a2"
  GCP_REGION: "us-central1"

jobs:
  terraform:
    name: "Terraform ${{ github.event_name == 'pull_request' && 'Plan' || 'Apply' }}"
    runs-on: ubuntu-latest

    permissions:
      id-token: write       # ← WIF के लिए ज़रूरी!
      contents: read
      pull-requests: write  # PR पर plan output comment करने के लिए

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      # ── 2. WIF Auth → GCP (Keyless! No JSON key) ─────────────────────────
      - name: "🔐 Authenticate to GCP via WIF"
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA_EMAIL }}
          # ✅ No JSON key — Secure!

      # ── 3. Setup Terraform ───────────────────────────────────────────────
      - name: "⚙️ Setup Terraform ${{ env.TF_VERSION }}"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ── 4. Terraform Init ────────────────────────────────────────────────
      - name: "🚀 Terraform Init"
        id: init
        run: terraform init

      # ── 5. Terraform Format Check ────────────────────────────────────────
      - name: "📐 Terraform Format Check"
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true   # Don't fail pipeline on format issues

      # ── 6. Terraform Validate ────────────────────────────────────────────
      - name: "✅ Terraform Validate"
        id: validate
        run: terraform validate -no-color

      # ── 7. Terraform Plan (on PR + push) ─────────────────────────────────
      - name: "📋 Terraform Plan"
        id: plan
        run: terraform plan -no-color -input=false -var-file="terraform.tfvars"
        env:
          TF_VAR_project_id: ${{ env.GCP_PROJECT }}

      # ── 8. Comment Plan on PR ────────────────────────────────────────────
      - name: "💬 Comment Plan on PR"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `## 🔧 Terraform Plan Results
            
            **Init:** \`${{ steps.init.outcome }}\`
            **Format:** \`${{ steps.fmt.outcome }}\`
            **Validate:** \`${{ steps.validate.outcome }}\`
            **Plan:** \`${{ steps.plan.outcome }}\`
            
            <details><summary>📋 Show Plan</summary>
            
            \`\`\`terraform
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            
            </details>
            
            *Pushed by: @${{ github.actor }} | Workflow: ${{ github.workflow }}*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      # ── 9. Terraform Apply (only on push to main, not PR) ────────────────
      - name: "🚀 Terraform Apply"
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform apply -auto-approve -input=false -var-file="terraform.tfvars"
        env:
          TF_VAR_project_id: ${{ env.GCP_PROJECT }}

      # ── 10. Output Results ───────────────────────────────────────────────
      - name: "📤 Terraform Outputs"
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform output
