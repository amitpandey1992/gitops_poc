name: "🔧 Terraform — Infrastructure Provisioning"

on:
  push:
    branches: [ main ]
    paths:
      - 'terraform/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'terraform/**'
  workflow_dispatch:

env:
  TF_VERSION: "1.9.0"
  WORKING_DIR: "./terraform"
  GCP_PROJECT: "project-616fef18-15b8-4d6c-8a2"
  GCP_REGION: "us-central1"
  WIF_PROVIDER: ${{ secrets.TASKFLOW_WIF_PROVIDER || 'projects/project-616fef18-15b8-4d6c-8a2/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider' }}
  WIF_SA_EMAIL: ${{ secrets.TASKFLOW_WIF_SA_EMAIL || 'github-actions-sa@project-616fef18-15b8-4d6c-8a2.iam.gserviceaccount.com' }}

jobs:
  terraform:
    name: "Terraform ${{ github.event_name == 'pull_request' && 'Plan' || 'Apply' }}"
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "🔐 Authenticate to GCP via WIF"
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA_EMAIL }}

      - name: "⚙️ Setup Terraform ${{ env.TF_VERSION }}"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: "🚀 Terraform Init"
        id: init
        run: terraform init

      - name: "📐 Terraform Format Check"
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: "✅ Terraform Validate"
        id: validate
        run: terraform validate -no-color

      - name: "📋 Terraform Plan"
        id: plan
        run: terraform plan -no-color -input=false -var-file="terraform.tfvars"
        env:
          TF_VAR_project_id: ${{ env.GCP_PROJECT }}

      - name: "💬 Comment Plan on PR"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `## 🔧 Terraform Plan Results
            
            **Init:** \`${{ steps.init.outcome }}\`
            **Format:** \`${{ steps.fmt.outcome }}\`
            **Validate:** \`${{ steps.validate.outcome }}\`
            **Plan:** \`${{ steps.plan.outcome }}\`
            
            <details><summary>📋 Show Plan</summary>
            
            \`\`\`terraform
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            
            </details>
            
            *Pushed by: @${{ github.actor }} | Workflow: ${{ github.workflow }}*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: "🚀 Terraform Apply"
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform apply -auto-approve -input=false -var-file="terraform.tfvars"
        env:
          TF_VAR_project_id: ${{ env.GCP_PROJECT }}

      - name: "📤 Terraform Outputs"
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform output
