name: TaskFlow CI

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write
  packages: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA_EMAIL }}

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Build and Push Docker Image with Jib
        env:
          ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
        run: |
          ./mvnw compile jib:build -Djib.to.tags=${GITHUB_SHA::7} \
          -Djib.to.auth.username=${ARTIFACTORY_USER} \
          -Djib.to.auth.password=${ARTIFACTORY_TOKEN}

      - name: Update Helm values.yaml
        run: |
          sed -i 's/tag: .*/tag: '${GITHUB_SHA::7}'/' helm-chart/values.yaml

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -am "Update image tag to ${GITHUB_SHA::7} [skip ci]"
          git push
