<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle} + ' — TaskFlow Pro'">TaskFlow Pro</title>

    <!-- Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<!-- ── Sidebar ─────────────────────────────────────────────────────────── -->
<div class="sidebar">
    <div class="sidebar-brand">
        <div class="brand-icon">
            <i class="bi bi-lightning-charge-fill"></i>
        </div>
        <span class="brand-name">TaskFlow</span>
        <span class="brand-badge">PRO</span>
    </div>

    <nav class="sidebar-nav">
        <div class="nav-section-label">MENU</div>

        <a th:href="@{/}" th:classappend="${activePage == 'dashboard'} ? 'active' : ''" class="nav-item">
            <i class="bi bi-grid-1x2-fill"></i>
            <span>Dashboard</span>
        </a>
        <a th:href="@{/tasks}" th:classappend="${activePage == 'tasks'} ? 'active' : ''" class="nav-item">
            <i class="bi bi-check2-square"></i>
            <span>Tasks</span>
        </a>
        <a th:href="@{/tasks/team}" th:classappend="${activePage == 'team'} ? 'active' : ''" class="nav-item">
            <i class="bi bi-people-fill"></i>
            <span>Team</span>
        </a>

        <div class="nav-section-label mt-3">GITOPS</div>
        <a href="https://github.com/amitpandey1992/gitops_poc" target="_blank" class="nav-item">
            <i class="bi bi-github"></i>
            <span>Repository</span>
        </a>
        <a href="/actuator/health" target="_blank" class="nav-item">
            <i class="bi bi-heart-pulse-fill"></i>
            <span>Health</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <div class="cluster-badge">
            <i class="bi bi-cloud-check-fill text-success"></i>
            <div>
                <div class="cluster-name">java-gke-cluster</div>
                <div class="cluster-region">us-central1</div>
            </div>
        </div>
    </div>
</div>

<!-- ── Main Content ────────────────────────────────────────────────────── -->
<div class="main-content">
    <!-- Top Bar -->
    <div class="topbar">
        <div class="topbar-left">
            <h1 class="page-title" th:text="${pageTitle}">Dashboard</h1>
        </div>
        <div class="topbar-right">
            <a th:href="@{/tasks/new}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg me-1"></i>New Task
            </a>
            <div class="avatar-circle">AP</div>
        </div>
    </div>

    <!-- Flash Messages -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show mx-4 mt-3" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Page Content -->
    <div class="content-body">
        <th:block th:replace="${content}"/>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<th:block th:replace="${scripts}"/>
</body>
</html>
